<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaiJunto · Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="app screen" id="cadastro">
    <header class="brand">
      <span class="logo" aria-hidden="true">vj</span>
      <span class="brand-name">VaiJunto</span>
    </header>

    <section class="hero" data-anim="hero">
      <h1>Carona entre quem já vai pro mesmo lugar.</h1>
      <p class="lead">Crie sua conta com o e-mail da UFVJM e encontre quem faz o seu trajeto.</p>
    </section>

    <div class="tabs" role="tablist" aria-label="Acesso">
      <span class="tabs-pill" aria-hidden="true"></span>
      <button class="tab is-active" role="tab" aria-selected="true" aria-controls="form-cadastro" id="tab-cadastro" data-tab="cadastro">Criar conta</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="form-login" id="tab-login" data-tab="login">Entrar</button>
    </div>

    <form class="card form" id="form-cadastro" role="tabpanel" aria-labelledby="tab-cadastro" data-anim="form">
      <label class="field">
        <span>Nome completo</span>
        <input type="text" name="nome" value="Ana Souza" autocomplete="name" required>
      </label>
      <label class="field">
        <span>E-mail institucional</span>
        <input type="email" name="email" value="ana.souza@ufvjm.edu.br" autocomplete="email" required>
        <small class="hint">Usamos o e-mail da UFVJM pra confirmar que você é da comunidade.</small>
      </label>
      <label class="field">
        <span>Celular</span>
        <input type="tel" name="celular" value="(38) 99876-5432" autocomplete="tel" required>
      </label>
      <label class="field">
        <span>Senha</span>
        <span class="input-wrap">
          <input type="password" name="senha" value="carona123" autocomplete="new-password" required id="senha">
          <button type="button" class="ghost-btn" data-toggle-senha aria-controls="senha">Mostrar</button>
        </span>
      </label>

      <fieldset class="field">
        <legend>Como você vai usar?</legend>
        <div class="chips" role="radiogroup">
          <label class="chip"><input type="radio" name="perfil" value="passageiro" checked><span>Passageiro</span></label>
          <label class="chip"><input type="radio" name="perfil" value="motorista"><span>Motorista</span></label>
          <label class="chip"><input type="radio" name="perfil" value="ambos"><span>Os dois</span></label>
        </div>
      </fieldset>

      <label class="check">
        <input type="checkbox" name="termos" checked required>
        <span>Li e aceito os termos de uso e a política de privacidade.</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block" data-submit>
        <span class="btn-label">Criar conta</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <form class="card form" id="form-login" role="tabpanel" aria-labelledby="tab-login" hidden>
      <label class="field">
        <span>E-mail institucional</span>
        <input type="email" value="ana.souza@ufvjm.edu.br" autocomplete="email">
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" value="carona123" autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block" data-submit>
        <span class="btn-label">Entrar</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button type="button" class="link-btn">Esqueci minha senha</button>
    </form>

    <section class="card sucesso" id="sucesso" hidden aria-live="polite">
      <svg class="check-icon" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="24" />
        <path d="M15 27 l7 7 l15 -16" />
      </svg>
      <h2>Conta criada, Ana!</h2>
      <p>Enviamos um link de confirmação pra <strong>ana.souza@ufvjm.edu.br</strong>. Pode seguir enquanto isso.</p>
      <a class="btn btn-primary btn-block" href="#" data-next>Buscar uma carona</a>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
