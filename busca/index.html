<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaiJunto · Buscar carona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="busca.css">
</head>
<body>
  <main class="app screen" id="busca">
    <nav class="passos" aria-label="Etapas">
      <ol><li class="feito">1. Cadastro</li><li aria-current="step">2. Carona</li><li>3. Pagamento</li></ol>
      <div class="passos-barra" aria-hidden="true"><i data-de="0.3333" data-ate="0.6667"></i></div>
    </nav>
    <header class="topo">
      <p class="saudacao">Olá, <strong data-nome>Ana</strong></p>
      <h1>Pra onde você vai?</h1>
    </header>

    <form class="card busca-card" id="form-busca">
      <div class="rota">
        <span class="rota-linha" aria-hidden="true"><i></i><b></b><i class="fim"></i></span>
        <div class="rota-campos">
          <label class="campo">
            <span class="sr-only">Origem</span>
            <input type="text" name="origem" value="Campus JK — UFVJM" id="origem">
          </label>
          <label class="campo">
            <span class="sr-only">Destino</span>
            <input type="text" name="destino" value="Centro — Diamantina" id="destino">
          </label>
        </div>
        <button type="button" class="trocar" aria-label="Inverter origem e destino" data-trocar>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v14m0 0-3-3m3 3 3-3M17 20V6m0 0-3 3m3-3 3 3"/></svg>
        </button>
      </div>

      <div class="quando" role="radiogroup" aria-label="Quando">
        <label class="chip"><input type="radio" name="dia" value="hoje" checked><span>Hoje</span></label>
        <label class="chip"><input type="radio" name="dia" value="amanha"><span>Amanhã</span></label>
        <label class="chip"><input type="radio" name="dia" value="sexta"><span>Sex, 27</span></label>
        <label class="chip hora"><span class="sr-only">Horário</span><input type="time" name="hora" value="07:30"></label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Buscar caronas</button>
    </form>

    <section class="resultados" id="resultados" hidden aria-live="polite">
      <div class="resultados-topo">
        <h2><span data-qtd>0</span> caronas no seu trajeto</h2>
        <p>Ordenadas pelo match com sua rota e horário.</p>
      </div>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <div class="sheet-fundo" id="sheet-fundo" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titulo" hidden>
    <span class="sheet-alca" aria-hidden="true"></span>
    <div class="sheet-motorista">
      <span class="avatar" data-f="iniciais"></span>
      <div>
        <h2 id="sheet-titulo" data-f="motorista"></h2>
        <p class="meta"><span data-f="nota"></span> ★ · <span data-f="viagens"></span> viagens</p>
      </div>
      <span class="match" data-f="match"></span>
    </div>
    <dl class="detalhes">
      <div><dt>Saída</dt><dd data-f="horario"></dd></div>
      <div><dt>Carro</dt><dd data-f="carro"></dd></div>
      <div><dt>Vagas</dt><dd data-f="vagas"></dd></div>
      <div><dt>Sua parte</dt><dd data-f="preco"></dd></div>
    </dl>
    <p class="ponto">📍 <span data-f="ponto"></span></p>
    <div class="sheet-acoes">
      <button type="button" class="btn btn-subtle" data-fechar>Voltar</button>
      <a class="btn btn-primary" href="../pagamento/index.html" data-next>Confirmar carona</a>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../shared/caronas.js"></script>
  <script src="../shared/fluxo.js"></script>
  <script src="busca.js"></script>
</body>
</html>
